name: test (cnn-vit-satellite-image-classifier)
on:
  push:
    paths:
      - "cnn-vit-satellite-image-classifier/**"
      - ".github/workflows/test-cnn-vit-satellite-image-classifier.yml"
  pull_request:
    paths:
      - "cnn-vit-satellite-image-classifier/**"
      - ".github/workflows/test-cnn-vit-satellite-image-classifier.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cnn-vit-satellite-image-classifier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r serve/requirements.txt pytest
      - name: Run tests
        run: pytest -q tests/
