name: test (tensor-graph-inference-engine)
on:
  push:
    paths:
      - "tensor-graph-inference-engine/**"
      - ".github/workflows/test-tensor-graph-inference-engine.yml"
  pull_request:
    paths:
      - "tensor-graph-inference-engine/**"
      - ".github/workflows/test-tensor-graph-inference-engine.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tensor-graph-inference-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest
