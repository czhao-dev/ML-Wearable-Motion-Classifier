name: test (agentic-ai-tool-use)
on:
  push:
    paths:
      - "agentic-ai-tool-use/**"
      - ".github/workflows/test-agentic-ai-tool-use.yml"
  pull_request:
    paths:
      - "agentic-ai-tool-use/**"
      - ".github/workflows/test-agentic-ai-tool-use.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic-ai-tool-use
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
