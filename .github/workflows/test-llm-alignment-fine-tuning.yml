name: test (llm-alignment-fine-tuning)
on:
  push:
    paths:
      - "llm-alignment-fine-tuning/**"
      - ".github/workflows/test-llm-alignment-fine-tuning.yml"
  pull_request:
    paths:
      - "llm-alignment-fine-tuning/**"
      - ".github/workflows/test-llm-alignment-fine-tuning.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm-alignment-fine-tuning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q tests/
