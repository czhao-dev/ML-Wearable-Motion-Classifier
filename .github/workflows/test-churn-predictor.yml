name: test (churn-predictor)
on:
  push:
    paths:
      - "churn-predictor/**"
      - ".github/workflows/test-churn-predictor.yml"
  pull_request:
    paths:
      - "churn-predictor/**"
      - ".github/workflows/test-churn-predictor.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: churn-predictor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q tests/
