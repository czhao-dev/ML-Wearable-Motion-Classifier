name: test (ml-model-compression)
on:
  push:
    paths:
      - "ml-model-compression/**"
      - ".github/workflows/test-ml-model-compression.yml"
  pull_request:
    paths:
      - "ml-model-compression/**"
      - ".github/workflows/test-ml-model-compression.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-model-compression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q tests/
