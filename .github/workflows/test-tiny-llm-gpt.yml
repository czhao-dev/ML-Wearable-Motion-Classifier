name: test (tiny-llm-gpt)
on:
  push:
    paths:
      - "tiny-llm-gpt/**"
      - ".github/workflows/test-tiny-llm-gpt.yml"
  pull_request:
    paths:
      - "tiny-llm-gpt/**"
      - ".github/workflows/test-tiny-llm-gpt.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tiny-llm-gpt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q tests/
