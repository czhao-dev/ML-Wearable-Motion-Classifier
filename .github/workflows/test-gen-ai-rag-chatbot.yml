name: test (gen-ai-rag-chatbot)
on:
  push:
    paths:
      - "gen-ai-rag-chatbot/**"
      - ".github/workflows/test-gen-ai-rag-chatbot.yml"
  pull_request:
    paths:
      - "gen-ai-rag-chatbot/**"
      - ".github/workflows/test-gen-ai-rag-chatbot.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gen-ai-rag-chatbot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q tests/
